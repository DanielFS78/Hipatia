# Empaquetado Windows (PyInstaller onedir). No se puede cruzar macOS → .exe de forma soportada.
# Se dispara en cada push a main (artefacto siempre reciente) y manualmente desde Actions.
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  pyinstaller:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: PyInstaller (hipatia.spec)
        run: pyinstaller --noconfirm hipatia.spec

      - name: Upload dist/Hipatia (onedir)
        uses: actions/upload-artifact@v6
        with:
          name: Hipatia-windows-onedir
          path: dist/Hipatia/
          retention-days: 14
          if-no-files-found: error
