[Database]
path = data/montaje.db
path_pilas = data/pilas.db
use_new_config = true
config_file = config/database.yaml
environment = development

[Migration]
backup_enabled = true
backup_directory = backups
validate_migration = true

[Application]
version = 2.0.0
debug = true
log_level = INFO

[Connection]
mode = sqlite

