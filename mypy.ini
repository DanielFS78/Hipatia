[mypy]
# Alineado con CI (3.11–3.12) y README; no usar 3.13 aquí si el soporte mínimo es 3.11
python_version = 3.12
plugins = sqlalchemy.ext.mypy.plugin
ignore_missing_imports = True
disallow_untyped_defs = False
check_untyped_defs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = False
no_implicit_optional = True
strict_optional = True
strict_equality = True
warn_unused_configs = True

# Excluir scripts y herramientas de análisis estricto
[mypy-scripts.*]

[mypy-tools.*]

# Scripts de depuración en tests (no forman parte de la suite)
[mypy-tests.debugging.*]
ignore_errors = True


# Librerías externas sin stubs
[mypy-PyQt6.*]
ignore_missing_imports = True

[mypy-reportlab.*]
ignore_missing_imports = True

[mypy-openpyxl.*]
ignore_missing_imports = True

[mypy-cv2.*]
ignore_missing_imports = True

[mypy-pyzbar.*]
ignore_missing_imports = True

[mypy-bcrypt.*]
ignore_missing_imports = True

# Módulos del proyecto — configuración gradual
