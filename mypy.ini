[mypy]
# Alineado con CI (3.11–3.12) y README; no usar 3.13 aquí si el soporte mínimo es 3.11
python_version = 3.12
plugins = sqlalchemy.ext.mypy.plugin
ignore_missing_imports = True
# Sin disallow global: scripts/tests sueltos no entran en CI con la misma exigencia
disallow_untyped_defs = False
check_untyped_defs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
disallow_untyped_calls = True
disallow_any_generics = True
disallow_incomplete_defs = True
no_implicit_optional = True
strict_optional = True
strict_equality = True
warn_unused_configs = True

# Punto de entrada (CI incluye app.py como módulo `app`)
[mypy-app]
disallow_untyped_defs = True

# Excluir scripts y herramientas de análisis estricto (tests pueden importarlos vía follow_imports)
[mypy-scripts.*]
ignore_errors = True

[mypy-tools.*]
ignore_errors = True

# Scripts de depuración en tests (no forman parte de la suite)
[mypy-tests.debugging.*]
ignore_errors = True

# Suite pytest: relajado respecto al global. Ojo: tests.* solo cubre 2 segmentos (p. ej. tests.conftest);
# los subpaquetes tests.unit.*, tests.integration.*, etc. necesitan su propia sección.
[mypy-tests]
disallow_untyped_defs = False
disallow_untyped_calls = False
disallow_any_generics = False
disallow_incomplete_defs = False
warn_return_any = False

[mypy-tests.*]
disallow_untyped_defs = False
disallow_untyped_calls = False
disallow_any_generics = False
disallow_incomplete_defs = False
warn_return_any = False

