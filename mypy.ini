[mypy]
python_version = 3.13
plugins = sqlalchemy.ext.mypy.plugin
ignore_missing_imports = True
disallow_untyped_defs = False
check_untyped_defs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = False
no_implicit_optional = True
strict_optional = True
strict_equality = True
warn_unused_configs = True

# Excluir scripts y herramientas de análisis estricto
[mypy-scripts.*]

[mypy-tools.*]

# Scripts de depuración en tests (no forman parte de la suite)
[mypy-tests.debugging.*]
ignore_errors = True


# Librerías externas sin stubs
[mypy-PyQt6.*]
ignore_missing_imports = True

[mypy-reportlab.*]
ignore_missing_imports = True

[mypy-openpyxl.*]
ignore_missing_imports = True

[mypy-cv2.*]
ignore_missing_imports = True

[mypy-pyzbar.*]
ignore_missing_imports = True

[mypy-bcrypt.*]
ignore_missing_imports = True

# Módulos del proyecto — configuración gradual
[mypy-core.*]
disallow_untyped_defs = False

[mypy-controllers.*]
disallow_untyped_defs = False

[mypy-ui.*]
disallow_untyped_defs = False

[mypy-database.*]
disallow_untyped_defs = False

[mypy-features.*]
disallow_untyped_defs = False

# Fase 4 — Módulos completados
[mypy-core.dtos]
disallow_untyped_defs = True

[mypy-core.reports_dtos]
