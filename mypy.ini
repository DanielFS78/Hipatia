# ITEM 004 — lote C paso 9: ProductService (dominio producto/iteraciones/materiales)
[mypy-core.services.product_service]
disallow_untyped_defs = True

# Plan arquitectura incremental — core.services (fachada informes + almacén temporal + reporting.base)
[mypy-core.services.report_strategy,core.services.temporal_storage,core.services.report_service,core.services.reporting.base]
