repos:
  - repo: local
    hooks:
      - id: docs-no-omissions
        name: docs-no-omissions
        entry: python3 scripts/check_documentation_omissions.py
        language: system
        pass_filenames: false
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies: [types-requests, types-PyQt6]
        args: [--config-file=mypy.ini]
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
